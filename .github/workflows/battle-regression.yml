name: Battle Mechanics Regression
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe public Render deployment
        run: |
          python - <<'PY'
          import urllib.request, urllib.error
          host = "https://champions-singles-lab.onrender.com"
          for endpoint in ["/api/health", "/"]:
              try:
                  req = urllib.request.Request(host + endpoint, headers={"User-Agent":"Champions-Lab-CI/1.0","Cache-Control":"no-cache"})
                  with urllib.request.urlopen(req, timeout=65) as r:
                      body = r.read(120000).decode("utf-8","replace")
                      print("[LIVE-PROBE] endpoint=",endpoint,"status=",r.status)
                      if endpoint == "/api/health": print("[LIVE-HEALTH]",body[:1500])
                      else:
                          print("[LIVE-MARKERS] megaTimingAudit=", "megaTimingAudit" in body,
                                "timingUI=", "메가진화 즉시 실행과 보류" in body,
                                "preMegaLog=", "openingEvents" in body)
              except Exception as e:
                  print("[LIVE-ERROR] endpoint=",endpoint,repr(e))
          PY
      - name: Verify live Render Korean catalog and all gendered formes
        run: node scripts/check-live-locale.cjs
      - name: Build pinned Champions showdown engine
        run: |
          mkdir -p /tmp/showdown
          cd /tmp/showdown
          git init
          git remote add origin https://github.com/smogon/pokemon-showdown.git
          git fetch --depth 1 origin d849b220082e113d8a17303509fb44d420c543d5
          git checkout --detach FETCH_HEAD
          npm install --omit=optional --no-audit --no-fund
          npm run build
      - name: Inspect all Korean text coverage
        env:
          SHOWDOWN_PACKAGE_PATH: /tmp/showdown
        run: node scripts/localization-audit.cjs
      - name: Diagnose stored Mimikyu and Mega Dragonite choices
        env:
          SHOWDOWN_PACKAGE_PATH: /tmp/showdown
        run: node scripts/dragonite-mimikyu-diagnostic.cjs --verify-live
      - name: Run full regression suite
        env:
          SHOWDOWN_PACKAGE_PATH: /tmp/showdown
        run: npm test
      - name: Compare live and local Mega Sceptile first-action decisions
        env:
          SHOWDOWN_PACKAGE_PATH: /tmp/showdown
        run: node scripts/mega-diagnostic.cjs --verify-live
