name: Battle Mechanics Regression
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build pinned Champions showdown engine
        run: |
          mkdir -p /tmp/showdown
          cd /tmp/showdown
          git init
          git remote add origin https://github.com/smogon/pokemon-showdown.git
          git fetch --depth 1 origin d849b220082e113d8a17303509fb44d420c543d5
          git checkout --detach FETCH_HEAD
          npm install --omit=optional --no-audit --no-fund
          npm run build
      - name: Run full regression suite
        env:
          SHOWDOWN_PACKAGE_PATH: /tmp/showdown
        run: npm test
